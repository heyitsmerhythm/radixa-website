name: Build and deploy website

# Runs every time you push to the main branch, and can also be run by hand
# from the Actions tab in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the workflow publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the newer build and cancel the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
